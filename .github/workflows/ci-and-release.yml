name: CI & Release Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Run shared core & download engine tests
        run: npx tsx --test shared/downloadCore.test.ts server/downloadManager.test.ts
      - name: Typecheck web console
        run: npm run lint

  build-android:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK Licenses
        run: |
          if [ -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" ]; then
            yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi
      - name: Run Android unit tests
        working-directory: android
        run: gradle test
      - name: Build Android APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.jks
          fi
          gradle assembleDebug assembleRelease
          rm -f app/release.jks
      - uses: actions/upload-artifact@v5
        with:
          name: my-download-manager-android-apk
          path: android/app/build/outputs/apk/**/*.apk

  build-windows:
    needs: unit-tests
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install & Build Windows EXE
        working-directory: desktop
        run: |
          npm install
          npm run dist:win
      - uses: actions/upload-artifact@v5
        with:
          name: my-download-manager-windows-exe
          path: desktop/release/*.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.apk" -o -name "*.exe" \) -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body: |
            ## My Download Manager ${{ github.ref_name }}

            ### Installation
            - **Android**: Download `app-release.apk` (or `app-debug.apk`), allow *Install unknown apps*, and verify checksum.
            - **Windows**: Download `My Download Manager Setup *.exe` (installer) or the portable `.exe`, verify checksum against `SHA256SUMS.txt`, and run.

            See `docs/PLATFORM_LIMITATIONS.md` for Scoped Storage and SmartScreen notes.
